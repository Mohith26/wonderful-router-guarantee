name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/guarantee.test.mjs
      - name: Results reproduce from the committed data
        run: |
          node scripts/report.mjs > /dev/null
          git diff --exit-code -- results/results.json
